name: daily-trace-pipeline

on:
  schedule:
    - cron: "0 4 * * *"   # 04:00 UTC — after the ~03:26 UTC prod-0 release drops
  workflow_dispatch:       # allow manual runs from the Actions tab

permissions:
  contents: read           # gh needs only read access to the (public) source repo

concurrency:
  group: daily-trace-pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      VARIANT: prod-0
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_PREFIX: legs
      RETENTION_DAYS: "30"   # keep the newest N date partitions; older are pruned
      TIPPECANOE_REF: "2.72.0"
      HEX_MEMORY: "12GB"     # runner has 16 GB; leave headroom for tippecanoe
      BUNDLE_MEMORY: "12GB"
      # rclone S3 remote "r2" assembled entirely from env (no config file)
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACL: private
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone build-essential libsqlite3-dev zlib1g-dev

      # tippecanoe isn't packaged for ubuntu-latest; ~1 min from source, cached
      # by ref so subsequent runs just restore the binaries.
      - name: Cache tippecanoe
        id: tippecanoe-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin
          key: tippecanoe-${{ env.TIPPECANOE_REF }}-${{ runner.os }}

      - name: Build tippecanoe
        if: steps.tippecanoe-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b "$TIPPECANOE_REF" https://github.com/felt/tippecanoe /tmp/tippecanoe
          make -j"$(nproc)" -C /tmp/tippecanoe
          mkdir -p ~/.local/bin
          cp /tmp/tippecanoe/tippecanoe /tmp/tippecanoe/tippecanoe-decode \
             /tmp/tippecanoe/tile-join ~/.local/bin/

      - name: Put tippecanoe on PATH
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Resolve latest release
        run: bash run_pipeline.sh resolve

      - name: Download + extract traces
        run: bash run_pipeline.sh fetch

      - name: Fit spline nodes
        run: bash run_pipeline.sh fit

      - name: Build per-airport legs
        run: bash run_pipeline.sh legs

      - name: Build H3 traffic tiles
        run: bash run_pipeline.sh hexes

      - name: Build + verify day bundle
        run: bash run_pipeline.sh bundle

      - name: Upload to R2
        run: bash run_pipeline.sh upload
