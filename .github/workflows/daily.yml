name: daily-trace-pipeline

on:
  schedule:
    - cron: "0 4 * * *"   # 04:00 UTC — after the ~03:26 UTC prod-0 release drops
  workflow_dispatch:       # allow manual runs from the Actions tab
    inputs:
      date:
        description: "Data date to process, YYYY-MM-DD (empty = latest release)"
        required: false
        default: ""
      retention_days:
        description: "Keep the newest N date partitions in R2"
        required: false
        default: "30"

permissions:
  contents: read           # gh needs only read access to the (public) source repo

concurrency:
  group: daily-trace-pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # hexes + bundle were added after the 120 the fetch/fit/legs run was
    # sized for; that run took ~1h15m, so give the two extra phases room
    # rather than have the first nightly hit the ceiling.
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      VARIANT: prod-0
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_PREFIX: legs
      SRC_DATE: ${{ inputs.date }}
      # A backfill of an OLD day must raise this, or the prune step deletes the
      # very partition the run just uploaded (it keeps the newest N by date).
      RETENTION_DAYS: ${{ inputs.retention_days || '30' }}
      HEX_MEMORY: "12GB"     # runner has 16 GB; leave the OS and spill room
      BUNDLE_MEMORY: "12GB"
      # The vector hexbin archive is off: nothing draws it and it cost 115 MB a
      # day against the raster's 8. Setting this also switches the tippecanoe
      # build steps on, which are skipped entirely while it is empty.
      HEX_VECTOR: ""
      TIPPECANOE_REF: "2.72.0"
      # rclone S3 remote "r2" assembled entirely from env (no config file)
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACL: private
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone

      # Only the vector hexbin archive needs tippecanoe, and HEX_VECTOR is empty,
      # so these three steps are skipped on a normal run. They stay wired up so
      # setting HEX_VECTOR is the only thing needed to get that archive back.
      - name: Cache tippecanoe
        if: env.HEX_VECTOR != ''
        id: tippecanoe-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin
          key: tippecanoe-${{ env.TIPPECANOE_REF }}-${{ runner.os }}

      # not packaged for ubuntu-latest; ~1 min from source, cached by ref
      - name: Build tippecanoe
        if: env.HEX_VECTOR != '' && steps.tippecanoe-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y -qq build-essential libsqlite3-dev zlib1g-dev
          git clone --depth 1 -b "$TIPPECANOE_REF" https://github.com/felt/tippecanoe /tmp/tippecanoe
          make -j"$(nproc)" -C /tmp/tippecanoe
          mkdir -p ~/.local/bin
          cp /tmp/tippecanoe/tippecanoe /tmp/tippecanoe/tippecanoe-decode \
             /tmp/tippecanoe/tile-join ~/.local/bin/

      - name: Put tippecanoe on PATH
        if: env.HEX_VECTOR != ''
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Resolve release (SRC_DATE, else latest)
        run: bash run_pipeline.sh resolve

      - name: Download + extract traces
        run: bash run_pipeline.sh fetch

      - name: Fit spline nodes
        run: bash run_pipeline.sh fit

      - name: Build per-airport legs
        run: bash run_pipeline.sh legs

      - name: Build H3 traffic tiles
        run: bash run_pipeline.sh hexes

      - name: Build + verify day bundle
        run: bash run_pipeline.sh bundle

      # Reaches back into date=D-1 to splice flights the archive boundary cut,
      # so it needs the R2 credentials to read the previous leg index. Skips the
      # settled table (not the whole phase) when that day is absent.
      - name: Build overnight artifacts
        run: bash run_pipeline.sh overnight

      - name: Upload to R2
        run: bash run_pipeline.sh upload
